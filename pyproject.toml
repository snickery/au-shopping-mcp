[project]
name = "au-shopping-mcp"
version = "0.1.0"
description = "MCP server for shopping at Australian online stores: product search, detail and price comparison across 26 retailers (Bunnings, JB Hi-Fi, Officeworks, Costco, ...) plus AliExpress"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick Engel", email = "nick@engel.au" }]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "shopping", "australia", "price-comparison", "bunnings", "retail"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # The kit pins the MCP SDK range (mcp<2) for every server built on it.
    "mcp-server-kit>=0.1,<0.2",
    "mcp[cli]>=1.0.0",
    "httpx[http2]>=0.27.0",
    "pydantic>=2.7",
    "selectolax>=0.3.21",
    "diskcache>=5.6",
    # Must match the tag of the mcr.microsoft.com/playwright/python base image
    # in the Containerfile, which ships the matching Chromium build.
    "playwright==1.47.0",
]

[project.urls]
Homepage = "https://github.com/snickery/au-shopping-mcp"
Repository = "https://github.com/snickery/au-shopping-mcp"
Issues = "https://github.com/snickery/au-shopping-mcp/issues"

[project.scripts]
au-shopping-mcp = "au_shopping_mcp.server:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/au_shopping_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
